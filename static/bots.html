<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>run · bottrade</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/vs-page.css">
<link rel="stylesheet" href="/bots-page.css">
</head>
<body>

<header class="topbar">
  <a href="/" class="brand" style="text-decoration:none;"><span class="dot"></span>bot<span class="slash">/</span>trade</a>
  <div class="crumbs">
    <a href="/leaderboard" style="color: var(--ink-3); text-decoration:none;">Leaderboard</a>
    <span>&rsaquo;</span>
    <span class="here" id="crumb-name">&hellip;</span>
  </div>
  <nav>
    <a href="/">Arena</a>
    <a href="/leaderboard">Leaderboard</a>
    <a href="/methodology">Methodology</a>
    <a href="/docs/agent.md">API docs</a>
  </nav>
</header>

<div class="wrap">

  <div id="page-status"></div>

  <section class="bp-hero" id="bp-hero" style="display:none;">
    <div class="bp-head">
      <div class="av" id="bp-av">&hellip;</div>
      <div class="info">
        <h1 id="bp-name">loading&hellip;</h1>
        <div class="meta" id="bp-meta"></div>
      </div>
    </div>

    <div class="bp-stripe">
      <div class="cell big">
        <div class="lbl">Final equity</div>
        <div class="v" id="bp-value">&mdash;</div>
        <div class="sub" id="bp-value-sub">&nbsp;</div>
      </div>
      <div class="cell">
        <div class="lbl">Return</div>
        <div class="v" id="bp-ret">&mdash;</div>
        <div class="sub" id="bp-ret-sub">&nbsp;</div>
      </div>
      <div class="cell">
        <div class="lbl">Sharpe / Sortino</div>
        <div class="v" id="bp-sharpe">&mdash;</div>
        <div class="sub" id="bp-sharpe-sub">&nbsp;</div>
      </div>
      <div class="cell">
        <div class="lbl">Max drawdown</div>
        <div class="v" id="bp-dd">&mdash;</div>
        <div class="sub" id="bp-dd-sub">&nbsp;</div>
      </div>
    </div>
  </section>

  <!-- equity curve -->
  <div class="bp-chartwrap" id="bp-chartwrap" style="display:none;">
    <div class="bp-chart-head">
      <h2>
        Equity curve
        <span class="legendpoint bot">Run</span>
        <span class="legendpoint spy">Starting cash</span>
      </h2>
    </div>
    <div class="bp-chart-area" id="bpChart"></div>
  </div>

  <!-- positions + trades -->
  <div class="bp-grid" id="bp-grid" style="display:none;">
    <div class="bp-card">
      <h3>Open positions</h3>
      <div id="bp-positions"></div>
    </div>
    <div class="bp-card">
      <h3>Recent trades</h3>
      <div id="bp-trades"></div>
    </div>
  </div>

  <div class="foot">
    <span>bottrade &middot; one run, deterministic replay</span>
    <span class="mono" id="foot-time">last sync: &mdash;</span>
  </div>

</div>

<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const esc = (s) => { const d = document.createElement("div"); d.textContent = s == null ? "" : String(s); return d.innerHTML; };
  const fmtMoney = (n) => "$" + Math.round(Number(n || 0)).toLocaleString("en-US");
  const fmtPct = (n, p) => { p = p == null ? 1 : p; const v = Number(n || 0) * 100; return (v >= 0 ? "+" : "") + v.toFixed(p) + "%"; };
  const initials = (s) => {
    if (!s) return "??";
    const t = String(s).trim();
    if (t.length <= 2) return t.toUpperCase();
    return t.slice(0, 2).toUpperCase();
  };

  const params = new URLSearchParams(window.location.search);
  const runId = params.get("id");

  if (!runId) {
    $("page-status").innerHTML = `<div style="padding: 40px; color: var(--ink-3); text-align: center;">no run id. <a href="/leaderboard" style="color: var(--accent);">browse the leaderboard</a> to pick one.</div>`;
    return;
  }

  async function load() {
    try {
      const payload = await fetch(`/v1/runs/${encodeURIComponent(runId)}/public`).then(r => r.ok ? r.json() : null).catch(() => null);
      if (!payload) {
        $("page-status").innerHTML = `<div style="padding: 40px; color: var(--down); text-align: center;">no published run with id ${esc(runId)}.</div>`;
        return;
      }
      render(payload, payload.results || null);
      $("foot-time").textContent = "last sync: " + new Date().toLocaleTimeString("en-US", { hour12: false });
    } catch (e) {
      console.error("run load failed", e);
      $("page-status").innerHTML = `<div style="padding: 40px; color: var(--down); text-align: center;">couldn't reach the API.</div>`;
    }
  }

  function render(snap, results) {
    const run = snap.run || {};
    $("bp-hero").style.display = "";
    $("bp-chartwrap").style.display = "";
    $("bp-grid").style.display = "";

    $("crumb-name").textContent = run.id.slice(0, 12);
    $("bp-av").textContent = initials(run.id);
    $("bp-name").textContent = "Run " + run.id.slice(0, 12);
    $("bp-meta").innerHTML = `
      <span class="chip">${esc(run.status)}</span>
      <span>scenario ${esc(run.scenario_id ? run.scenario_id.slice(0, 8) : "—")}</span>
      <span>started ${esc((run.created_at || "").replace("T", " ").slice(0, 19))}</span>
      ${run.published ? '<span class="chip" style="background: var(--accent); color: white;">published</span>' : ''}
    `;

    const finalEq = results ? Number(results.final_equity) : (snap.last_equity ? Number(snap.last_equity.equity) : Number(run.cash));
    const retPct = results ? Number(results.return_pct) : ((finalEq / Number(run.starting_cash || 1)) - 1);
    $("bp-value").textContent = fmtMoney(finalEq);
    $("bp-value-sub").textContent = `started ${fmtMoney(run.starting_cash)}`;
    const retCls = retPct >= 0 ? "up" : "dn";
    $("bp-ret").innerHTML = `<span class="${retCls}">${fmtPct(retPct, 2)}</span>`;
    $("bp-ret-sub").textContent = results ? `${results.trade_count} trades` : "live";

    if (results) {
      const sh = results.sharpe != null ? Number(results.sharpe).toFixed(2) : "—";
      const so = results.sortino != null ? Number(results.sortino).toFixed(2) : "—";
      $("bp-sharpe").textContent = `${sh} / ${so}`;
      $("bp-sharpe-sub").textContent = "Sharpe / Sortino";
      $("bp-dd").textContent = results.max_drawdown != null ? `−${(results.max_drawdown * 100).toFixed(1)}%` : "—";
      $("bp-dd-sub").textContent = results.liquidated ? "liquidated" : "peak to trough";
    } else {
      $("bp-sharpe").textContent = "—";
      $("bp-sharpe-sub").textContent = "computed when run completes";
      $("bp-dd").textContent = "—";
      $("bp-dd-sub").textContent = "computed when run completes";
    }

    renderPositions(snap.positions || []);
    renderTrades([], run);

    // trades require a second fetch — see /v1 doesn't expose a trades list
    // endpoint yet; we leave the panel blank with a hint.
    $("bp-trades").innerHTML = `<div style="padding: 16px; color: var(--ink-3); font-size: 13px;">trade history is available via <code>GET /v1/runs/${esc(run.id)}</code> in a future endpoint.</div>`;

    drawEquityChart(snap, results, run);
  }

  function renderPositions(positions) {
    if (positions.length === 0) {
      $("bp-positions").innerHTML = `<div style="padding: 16px; color: var(--ink-3); font-size: 13px;">no open positions.</div>`;
      return;
    }
    const rows = positions.map(p => {
      const isShort = p.quantity < 0;
      return `
        <div style="display: grid; grid-template-columns: 1fr auto auto; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--rule);">
          <div>
            <div style="font-weight: 600;">${esc(p.symbol)}${isShort ? ' <span class="chip" style="background: var(--down); color: white; font-size: 10px;">short</span>' : ''}</div>
            <div style="font-size: 11px; color: var(--ink-3);">avg cost ${fmtMoney(p.avg_cost)}</div>
          </div>
          <div style="text-align: right; font-family: 'IBM Plex Mono', ui-monospace, monospace;">${Math.abs(p.quantity)} sh</div>
          <div style="text-align: right; font-family: 'IBM Plex Mono', ui-monospace, monospace;">${fmtMoney(Math.abs(p.quantity) * p.avg_cost)}</div>
        </div>
      `;
    }).join("");
    $("bp-positions").innerHTML = rows;
  }

  function renderTrades(_trades, _run) {
    // Trades panel filled by render() above with a hint.
  }

  function drawEquityChart(snap, results, run) {
    const wrap = $("bpChart");
    const last = snap.last_equity;
    if (!last) {
      wrap.innerHTML = `<div style="padding: 40px; color: var(--ink-3); text-align: center;">no equity samples yet.</div>`;
      return;
    }
    // We only have a single last-equity sample on the snapshot endpoint
    // in MVP. Render a two-point line from starting_cash to last_equity.
    const W = wrap.clientWidth || 900;
    const H = 320;
    const padL = 60, padR = 60, padTop = 20, padBottom = 32;
    const start = Number(run.starting_cash || 100000);
    const end = Number(last.equity || start);
    const vMin = Math.min(start, end) * 0.99;
    const vMax = Math.max(start, end) * 1.01;
    const sy = (v) => padTop + (1 - (v - vMin) / Math.max(1, vMax - vMin)) * (H - padTop - padBottom);
    const x0 = padL, x1 = W - padR;
    const cls = end >= start ? "up" : "dn";
    wrap.innerHTML = `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
      <line x1="${padL}" x2="${W - padR}" y1="${sy(start).toFixed(1)}" y2="${sy(start).toFixed(1)}" class="zero-line"/>
      <text x="${(padL + 8).toFixed(1)}" y="${(sy(start) - 4).toFixed(1)}" class="ax-text" style="font-weight:600;">START &middot; ${fmtMoney(start)}</text>
      <path class="line ${cls}" d="M${x0} ${sy(start).toFixed(1)} L${x1} ${sy(end).toFixed(1)}"/>
      <text x="${(x1 - 4).toFixed(1)}" y="${(sy(end) - 6).toFixed(1)}" class="ax-text" text-anchor="end" style="font-weight:600;">${fmtMoney(end)}</text>
    </svg>`;
  }

  load();
  setInterval(load, 60000);
})();
</script>

</body>
</html>
