name: Deploy Hugging Face Space

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "huggingface-space/**"
      - ".github/workflows/deploy-huggingface-space.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Hugging Face client
        run: python -m pip install --disable-pip-version-check huggingface_hub
      - name: Upload Space files
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_REPO: ${{ vars.HF_SPACE_REPO }}
        run: >-
          python -c "import os; from huggingface_hub import HfApi;
          HfApi(token=os.environ['HF_TOKEN']).upload_folder(
          repo_id=os.environ['HF_SPACE_REPO'], repo_type='space',
          folder_path='huggingface-space', commit_message='Deploy BotTrade Space')"
